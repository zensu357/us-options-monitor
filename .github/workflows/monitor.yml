# 盘中轻量巡检:只盯修复信号(R2/R3/R4),不拉期权链。
# 全量任务已拆到 eod.yml —— 本文件永远只做轻量,与触发延迟无关。
name: monitor

on:
  schedule:
    # UTC 14:07 - 20:37 每半小时(冬令时覆盖美股 09:00-15:30 ET)。
    # 避开 :00/:30 —— GitHub 官方说明整点/半点为调度高峰,任务可能被丢弃。
    - cron: "7,37 14-20 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "true = 额外强发一条状态板推送(验证推送通路)"
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: usoptmon
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      USOPTMON_NOTIFY: ${{ secrets.USOPTMON_NOTIFY }}
      USOPTMON_WEBHOOK: ${{ secrets.USOPTMON_WEBHOOK }}
      USOPTMON_SMTP_HOST: ${{ secrets.USOPTMON_SMTP_HOST }}
      USOPTMON_SMTP_PORT: ${{ secrets.USOPTMON_SMTP_PORT }}
      USOPTMON_SMTP_USER: ${{ secrets.USOPTMON_SMTP_USER }}
      USOPTMON_SMTP_PASS: ${{ secrets.USOPTMON_SMTP_PASS }}
      USOPTMON_MAIL_TO: ${{ secrets.USOPTMON_MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 只缓存盯盘状态(state/),绝不缓存 data/——缓存里的旧数据会覆盖
      # git 中的新版本,把已清理的行复活。
      - name: Restore watch state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-${{ github.run_id }}
          restore-keys: |
            watch-

      - name: Light watch
        run: |
          set -o pipefail
          python3 -m usoptmon watch --no-chain ${{ inputs.test_notify == 'true' && '--test' || '' }} | tee -a pipeline.log

      # 自愈:GitHub cron 丢弃率很高,收盘任务可能被跳过。
      # 盘中每次运行都检查"今天是否已收盘但还没数据",需要就顺手补跑全量。
      - name: EOD catch-up
        run: |
          set -o pipefail
          if python3 -m usoptmon need-eod | tee -a pipeline.log | grep -q "need-eod: YES"; then
            echo ">>> 补跑收盘全量" | tee -a pipeline.log
            python3 -m usoptmon run --years 1 --no-raw | tee -a pipeline.log
            python3 -m usoptmon watch | tee -a pipeline.log
            python3 -m usoptmon mark-eod | tee -a pipeline.log
            git config user.name "usoptmon-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data state
            git commit -m "eod catch-up $(date -u +%F)" || echo "no changes"
            git push || echo "push skipped"
          else
            echo ">>> 无需补跑" | tee -a pipeline.log
          fi

      - name: Step summary
        if: always()
        run: |
          {
            echo "## usoptmon intraday $(date -u +%Y-%m-%dT%H:%MZ)"
            echo '```'
            cat pipeline.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save watch state
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-${{ github.run_id }}
