# 收盘全量任务:拉期权链 → 评分 → 报告 → 盯盘 → 回提交数据。
# 独立成一个 workflow,是为了让"全量/轻量"由文件决定,而不是靠触发时刻推断——
# GitHub 的 schedule 延迟可达数小时,基于时间的判断一定会出错。
name: eod

on:
  schedule:
    # UTC 21:23 ≈ 冬令时 ET 16:23(收盘后)。避开整点半点,降低被丢弃概率。
    - cron: "23 21 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "true = 额外强发一条状态板推送(验证邮件通路)"
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: usoptmon-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    env:
      USOPTMON_NOTIFY: ${{ secrets.USOPTMON_NOTIFY }}
      USOPTMON_WEBHOOK: ${{ secrets.USOPTMON_WEBHOOK }}
      USOPTMON_SMTP_HOST: ${{ secrets.USOPTMON_SMTP_HOST }}
      USOPTMON_SMTP_PORT: ${{ secrets.USOPTMON_SMTP_PORT }}
      USOPTMON_SMTP_USER: ${{ secrets.USOPTMON_SMTP_USER }}
      USOPTMON_SMTP_PASS: ${{ secrets.USOPTMON_SMTP_PASS }}
      USOPTMON_MAIL_TO: ${{ secrets.USOPTMON_MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Full pipeline
        run: |
          set -o pipefail
          python3 -m usoptmon run --years 1 --no-raw | tee -a pipeline.log
          python3 -m usoptmon watch ${{ inputs.test_notify == 'true' && '--test' || '' }} | tee -a pipeline.log

      - name: Step summary
        if: always()
        run: |
          {
            echo "## usoptmon EOD $(date -u +%Y-%m-%dT%H:%MZ)"
            echo '```'
            cat pipeline.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name "usoptmon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "eod $(date -u +%F)" || echo "no changes"
          git push

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/
          retention-days: 30
