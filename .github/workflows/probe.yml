# 临时诊断探针:验证本仓库的 schedule 触发是否工作。
# 每 5 分钟一次,只输出时间戳。诊断结束后应删除此文件。
name: cron-probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "probe fired at $(date -u +%F' '%T) UTC"
          echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
